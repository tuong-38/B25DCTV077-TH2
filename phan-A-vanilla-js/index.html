<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thư Viện Lớp - Vanilla JS</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { max-width: 1000px; margin: 0 auto; padding: 15px; background-color: #f4f6f8; }
    header { display: flex; justify-content: space-between; align-items: center; background: #007bff; color: white; padding: 15px 20px; border-radius: 8px; }
    .toolbar { display: flex; gap: 10px; margin: 15px 0; flex-wrap: wrap; }
    .toolbar input, .toolbar select { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 150px; }
    .status-bar { margin-bottom: 15px; font-weight: bold; color: #555; }
    
    /* Responsive Grid: 3 cột máy tính, 1 cột điện thoại */
    .book-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
    @media (max-width: 768px) { .book-grid { grid-template-columns: 1fr; } }
    
    .book-card { background: white; padding: 15px; border-radius: 6px; border: 1px solid #ddd; display: flex; flex-direction: column; justify-content: space-between; }
    .book-card h4 { margin: 0 0 8px 0; color: #333; }
    .book-card p { margin: 4px 0; font-size: 14px; color: #666; }
    .card-btns { display: flex; gap: 10px; margin-top: 10px; }
    .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .btn-fav { background: #ffc107; color: #000; }
    .btn-fav.active { background: #ff9800; color: white; font-weight: bold; }
    .btn-del { background: #dc3545; color: white; }
    
    .form-container { background: white; padding: 20px; border-radius: 6px; border: 1px solid #ddd; margin-top: 30px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 4px; font-weight: bold; }
    .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .error-msg { color: red; font-size: 12px; margin-top: 3px; display: block; }
    .btn-submit { background: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
  </style>
</head>
<body>

  <header>
    <h2>Thư Viện Lớp Học</h2>
    <div>Sách yêu thích: <span id="favCount">0</span></div>
  </header>

  <main>
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Tìm kiếm theo tên sách..." />
      <select id="genreSelect">
        <option value="All">Tất cả thể loại</option>
      </select>
    </div>

    <div id="statusBar" class="status-bar">Đang tải dữ liệu...</div>
    <div id="bookGrid" class="book-grid"></div>

    <div class="form-container">
      <h3>Thêm Sách Mới</h3>
      <form id="addBookForm">
        <div class="form-group">
          <label>Tên sách (*)</label>
          <input type="text" id="titleInput" />
          <span class="error-msg" id="titleError"></span>
        </div>
        <div class="form-group">
          <label>Tác giả (*)</label>
          <input type="text" id="authorInput" />
          <span class="error-msg" id="authorError"></span>
        </div>
        <div class="form-group">
            <label>Thể loại (*)</label>
            <input type="text" id="genreInput" placeholder="Nhập thể loại (VD: Công nghệ, Kinh tế...)" />
            <span class="error-msg" id="genreError"></span>
        </div>
        <div class="form-group">
          <label>Năm xuất bản (*)</label>
          <input type="number" id="yearInput" />
          <span class="error-msg" id="yearError"></span>
        </div>
        <button type="submit" class="btn-submit">Thêm Sách</button>
      </form>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
